<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Intro – M1 Network Sandbox</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0f1f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        /* Animated network‑like background */
        .bg-network {
            position: absolute;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 20% 50%, rgba(30, 144, 255, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 30%, rgba(255, 99, 71, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 50% 80%, rgba(0, 255, 127, 0.1) 0%, transparent 50%);
            z-index: 0;
        }

        .grid {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: 0;
        }

        /* Floating dots (simulate packets) */
        .dot {
            position: absolute;
            background: rgba(30, 144, 255, 0.7);
            width: 8px;
            height: 8px;
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(30, 144, 255, 0.5);
            z-index: 1;
            animation: float 6s infinite ease-in-out;
        }

        .dot:nth-child(1) { left: 10%; animation-delay: 0s; }
        .dot:nth-child(2) { left: 30%; animation-delay: 1s; background: rgba(255, 99, 71, 0.7); box-shadow: 0 0 15px rgba(255, 99, 71, 0.5); }
        .dot:nth-child(3) { left: 50%; animation-delay: 2s; }
        .dot:nth-child(4) { left: 70%; animation-delay: 3s; background: rgba(0, 255, 127, 0.7); box-shadow: 0 0 15px rgba(0, 255, 127, 0.5); }
        .dot:nth-child(5) { left: 90%; animation-delay: 4s; }

        @keyframes float {
            0% { top: 120%; opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { top: -10%; opacity: 0; }
        }

        /* Main content card */
        .intro-card {
            position: relative;
            z-index: 10;
            background: rgba(15, 25, 45, 0.85);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 60px 80px;
            text-align: center;
            max-width: 900px;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.6);
            animation: fadeSlideUp 1.8s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
            transform: translateY(30px);
            opacity: 0;
        }

        @keyframes fadeSlideUp {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .subtitle {
            font-size: 1.4rem;
            color: #7ec8e3;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        .title {
            font-size: 3.2rem;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.3;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #1e90ff, #00c6ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .milestone {
            font-size: 1.8rem;
            color: #f39c12;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .author {
            font-size: 1.3rem;
            color: #b0b0b0;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        .institution {
            font-size: 1rem;
            color: #7a7a7a;
            letter-spacing: 1px;
        }

        .line {
            width: 120px;
            height: 3px;
            background: linear-gradient(to right, #1e90ff, #00c6ff);
            margin: 25px auto;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <!-- Background grid -->
    <div class="grid"></div>
    <div class="bg-network"></div>

    <!-- Floating dots -->
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>

    <!-- Intro content -->
    <div class="intro-card">
        <!-- <div class="subtitle">Final Year Project</div> -->
        <div class="title">Multi‑Agent Reinforcement Learning<br>for Adaptive TCP Congestion Control</div>
        <div class="milestone">Milestone 1: Network Sandbox</div>
        <div class="line"></div>
        <div class="author">Okafor Kosisochukwu Johnpaul</div>
        <div class="institution">Federal University of Technology, Owerri (FUTO)</div>
    </div>
</body>
</html>
